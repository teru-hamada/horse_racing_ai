# pytest のプロジェクト共通設定ファイル。日本語コメントは UTF-8 で保存する。
# プロジェクトのルートで python -m pytest を実行すると、この設定が読み込まれる。
# 「#」から始まる行は説明用のコメントであり、テストの動作には影響しない。

# pytest の設定項目を記述するセクション。
[pytest]

# テストに付ける独自マーカーを登録する。
# 登録すると、pytest がマーカー名と説明を認識し、未登録マーカーの警告を防げる。
# 各行は「マーカー名: 説明」の形式で、markers = より深くインデントして記述する。
# マーカーの一覧と説明は python -m pytest --markers で確認できる。
#
# e2e は、複数の処理をつなげてアプリ全体の流れを検証するテストの識別用マーカー。
# テスト関数に @pytest.mark.e2e を付けて使用する。
# tests/test_e2e_offline.py では、保存済み HTML の解析から特徴量生成・学習・予測・比較などを検証する。
# 「offline」はテストの設計を表し、この設定自体にネットワーク通信を禁止する機能はない。
# 外部通信の禁止や一時フォルダーへの出力は、テスト側で実装している。
#
# 実行例（プロジェクトのルートで実行）:
#   python -m pytest              : e2e を含む通常のテスト収集・実行
#   python -m pytest -m e2e       : e2e マーカー付きのテストだけを実行
#   python -m pytest -m "not e2e" : e2e マーカー付きのテストを除外して実行
# マーカーの登録だけでは、実行対象の限定・除外や実行順序の指定は行われない。
markers =
    e2e: offline end-to-end tests that exercise the complete application pipeline
