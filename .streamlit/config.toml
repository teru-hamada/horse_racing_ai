# Streamlit のプロジェクト設定。
# プロジェクト直下で run_app.bat または streamlit run app.py を実行すると読み込まれる。
# 競馬予測モデルの学習条件ではなく、Streamlit の画面表示を設定するファイル。

# ブラウザ側の表示・操作に関する設定。
[client]
# 画面右上のツールバーとオプションメニューに表示する項目を制御する。
# "minimal" は、外部サービス（Streamlit Community Cloud など）や
# st.set_page_config(menu_items=...) で指定された項目だけを表示する。
# 表示対象の項目がなければ、メニュー自体を非表示にする。
# このアプリでは、通常の利用に不要な開発者向けの操作を減らすために指定する。
#
# 選択可能な値：
#   "auto"      : 既定値。localhost 経由、または Community Cloud の開発者として
#                 アクセスした場合に開発者向け項目を表示し、それ以外では隠す。
#   "developer" : 開発者向け項目（再実行、キャッシュ削除、デプロイなど）を表示する。
#   "viewer"    : 開発者向け項目を隠し、閲覧者向け項目を表示する。
#   "minimal"   : 外部サービスやアプリ側で指定した項目だけを表示する。
#
# 注意：メニューの表示を変える設定であり、認証やアクセス制限には使用できない。
toolbarMode = "minimal"
