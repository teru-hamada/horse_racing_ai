name: セキュリティ検査

on:
  push:
    branches: [main]
    paths: ['.github/**', 'src/**', 'scripts/**', 'tests/**', 'requirements*.txt']
  pull_request:
    paths: ['.github/**', 'src/**', 'scripts/**', 'tests/**', 'requirements*.txt']
  schedule:
    - cron: '17 21 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  public-files:
    name: Public file safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest tests/test_public_site_security.py tests/test_secure_publication.py -q
      - run: python scripts/validate_public_site.py docs --check-repository

  codeql:
    name: Python security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  dependencies:
    name: Dependency vulnerability audit
    # PR由来のコードには非公開リポジトリの鍵を渡さない。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned runtime requirements only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.PRIVATE_DATA_REPOSITORY }}
          ref: ${{ vars.PRIVATE_DATA_REF }}
          ssh-key: ${{ secrets.PRIVATE_DATA_SSH_KEY }}
          path: .private-runtime
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /prediction_bundle/requirements.txt
            /prediction_bundle/.python-version
            /prediction_bundle/manifest.json
            /snapshot.json
            /parts/
      - name: Restore verified environment metadata (legacy or split)
        run: python scripts/private_runtime.py restore --source .private-runtime --metadata-only --output .private-runtime/audit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .private-runtime/audit/prediction_bundle/.python-version
      - name: Install runtime and GUI dependencies with CPU PyTorch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          requirements = Path('.private-runtime/audit/prediction_bundle/requirements.txt').read_text()
          version = next(line.split('==', 1)[1] for line in requirements.splitlines() if line.startswith('torch=='))
          subprocess.run([sys.executable, '-m', 'pip', 'install', 'torch==' + version,
                          '--index-url', 'https://download.pytorch.org/whl/cpu'], check=True)
          PY
          python -m pip install -r requirements.txt -c .private-runtime/audit/prediction_bundle/requirements.txt
          python -m pip install pip-audit==2.10.1
      - name: Audit installed direct and transitive dependencies
        run: python scripts/audit_dependencies.py
