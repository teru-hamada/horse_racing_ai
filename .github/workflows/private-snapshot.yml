name: 非公開データの保存・復元検証

on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: "検証する非公開コミットSHA（空欄は現在の本番参照）"
        type: string
        required: false

permissions: {}
concurrency:
  group: private-snapshot-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Require default branch
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate pinned private reference
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', os.environ['REPOSITORY']):
              raise SystemExit('Invalid private repository')
          if not re.fullmatch(r'[0-9a-fA-F]{40}', os.environ['PRIVATE_REF']):
              raise SystemExit('A full private commit SHA is required')
          PY
        env:
          REPOSITORY: ${{ vars.PRIVATE_DATA_REPOSITORY }}
          PRIVATE_REF: ${{ inputs.private_ref || vars.PRIVATE_DATA_REF }}
      - name: Checkout private data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ vars.PRIVATE_DATA_REPOSITORY }}
          ref: ${{ inputs.private_ref || vars.PRIVATE_DATA_REF }}
          ssh-key: ${{ secrets.PRIVATE_DATA_SSH_KEY }}
          path: .private-runtime/source
          persist-credentials: false
          sparse-checkout: |
            data
            prediction_bundle
            parts
      - name: Restore legacy or split snapshot
        run: python scripts/private_runtime.py restore --source .private-runtime/source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: prediction_bundle/.python-version
      - name: Install pinned CPU environment
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          manifest = json.loads(Path('prediction_bundle/manifest.json').read_text())
          version = manifest['versions']['torch'].split('+')[0]
          subprocess.run([sys.executable, '-m', 'pip', 'install', 'torch==' + version,
                          '--index-url', 'https://download.pytorch.org/whl/cpu'], check=True)
          PY
          python -m pip install -r prediction_bundle/requirements.txt -r requirements-security.txt
      - name: Verify restored runtime and CPU inference
        run: python scripts/verify_private_runtime.py
      - name: Save split snapshot and restore to isolated directory
        run: |
          python scripts/private_runtime.py prepare --output .private-runtime/roundtrip
          python scripts/private_runtime.py restore --source .private-runtime/roundtrip --output .private-runtime/roundtrip-restored
          python - <<'PY'
          from pathlib import Path
          from scripts.private_runtime import FILES, digest
          restored = Path('.private-runtime/roundtrip-restored')
          if not all(digest(Path(name)) == digest(restored / name) for name in FILES):
              raise SystemExit('Private snapshot round-trip mismatch')
          print('Split snapshot round-trip verified; no private artifacts uploaded.')
          PY
